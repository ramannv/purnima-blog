<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Blog – Purnima Rohilla" />
  <title>Blog – Purnima Rohilla</title>
  <link rel="icon" type="image/x-icon" href="photo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Lora&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #111111;
      --muted-light: #cdcdcd;
      --border-light: #dddddd;

      --bg-dark: #1a1a1a;
      --text-dark: #f5f5f5;
      --muted-dark: #dedada;
      --border-dark: #333333;
    }

    html[data-theme='light'] {
      --bg: var(--bg-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
    }

    html[data-theme='dark'] {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --muted: var(--muted-dark);
      --border: var(--border-dark);
    }

    html {
      overflow-y: scroll;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Lora', serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.75;
      font-size: 18px;
      transition: background-color 0.3s, color 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .toggle-btn {
      position: fixed;
      top: 0.6rem;
      right: 1rem;
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      background-color: var(--bg);
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s, border 0.3s;
      z-index: 1001;
    }

    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem;
      font-family: 'Playfair Display', serif;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .topnav a {
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .topnav a:hover,
    .topnav a.active {
      color: var(--text);
      font-weight: bold;
    }

    .topnav .divider {
      color: var(--border);
      user-select: none;
    }

    /* Coming Soon */
    .coming-soon-wrapper {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
    }

    .coming-soon-wrapper h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin: 0 0 1rem 0;
      letter-spacing: 0.05em;
    }

    .coming-soon-wrapper p {
      color: var(--muted);
      font-size: 1.5rem;
      margin: 0;
    }

    .hr-divider {
      width: 60px;
      height: 1px;
      background-color: var(--border);
      margin: 1.5rem auto;
    }

    .office-quote {
      margin: 2.5rem auto 0;
      max-width: 480px;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.8;
      padding-left: 0;
      text-align: center;
    }

    .office-quote cite {
      display: block;
      margin-top: 0.75rem;
      font-style: normal;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    /* Blog listing */
    .blog-wrapper {
      flex: 1;
      width: 100%;
      max-width: 720px;
      padding: 6rem 1.5rem 4rem;
      display: none;
    }

    .blog-wrapper h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin: 0 0 2rem 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .post-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .post-item {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .post-item a {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      text-decoration: none;
      color: var(--text);
    }

    .post-item a:hover {
      text-decoration: underline;
    }

    .post-date {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* Single post view */
    .post-wrapper {
      flex: 1;
      width: 100%;
      max-width: 720px;
      padding: 6rem 1.5rem 4rem;
      display: none;
      flex-direction: column;
    }

    .post-wrapper h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin: 0 0 0.5rem 0;
    }

    .post-wrapper .post-date {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
      display: block;
    }

    .post-wrapper .post-body {
      line-height: 1.9;
    }

    .post-wrapper .post-body h1,
    .post-wrapper .post-body h2,
    .post-wrapper .post-body h3 {
      font-family: 'Playfair Display', serif;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--text);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    @media (max-width: 480px) {
      .topnav a {
        font-size: 0.75rem;
        padding: 0.4rem 0.5rem;
      }
      .coming-soon-wrapper h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <button class="toggle-btn" onclick="toggleTheme()" id="theme-toggle" title="Toggle light/dark mode">
    🌞 Dark
  </button>

  <nav class="topnav">
    <a href="index.html">About</a>
    <span class="divider">|</span>
    <a href="blog.html" class="active">Blog</a>
  </nav>

  <!-- Coming Soon (shown when no posts) -->
  <div class="coming-soon-wrapper" id="coming-soon">
    <h1>Blog</h1>
    <div class="hr-divider"></div>
    <p>Coming Soon</p>
    <blockquote class="office-quote">
      "Before I do anything I ask myself, 'Would an idiot do that?' And if the answer is yes, I do not do that thing."
      <cite>— Dwight Schrute</cite>
    </blockquote>
  </div>

  <!-- Blog post listing (shown when posts exist) -->
  <div class="blog-wrapper" id="blog-listing">
    <h1>Blog</h1>
    <ul class="post-list" id="post-list"></ul>
  </div>

  <!-- Single post view -->
  <div class="post-wrapper" id="post-view">
    <a class="back-link" href="/blog.html">← Back to Blog</a>
    <h1 id="post-title"></h1>
    <span class="post-date" id="post-date"></span>
    <div class="post-body" id="post-body"></div>
  </div>

  <footer>
    &copy; 2025 Purnima Rohilla — All rights reserved.
  </footer>

  <!-- Marked.js for rendering markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    marked.setOptions({ breaks: true });
  </script>

  <script>
    // Theme toggle
    const toggleBtn = document.getElementById("theme-toggle");
    const saved = localStorage.getItem("theme");
    if (saved) {
      document.documentElement.setAttribute("data-theme", saved);
      updateToggleText(saved);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      updateToggleText(next);
    }
    function updateToggleText(theme) {
      toggleBtn.textContent = theme === "light" ? "🌞 Dark" : "🌙 Light";
    }

    // GitHub config
    const GITHUB_USER = "ramannv";
    const GITHUB_REPO = "purnima-blog";
    const POSTS_PATH = "_posts";
    const BRANCH = "main";
    const API_BASE = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_PATH}?ref=${BRANCH}`;

    // Parse frontmatter from markdown
    function parseFrontmatter(text) {
      const match = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (!match) return { meta: {}, body: text };
      const meta = {};
      match[1].split("\n").forEach(line => {
        const [key, ...val] = line.split(":");
        if (key) meta[key.trim()] = val.join(":").trim().replace(/^["']|["']$/g, "");
      });
      return { meta, body: match[2] };
    }

    // Format date nicely
    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    // Check if viewing a single post
    // Support both /blog/slug (via redirect) and ?post=slug (direct)
    const params = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const postSlug = params.get("post") || (pathParts[0] === "blog" && pathParts[1] ? pathParts[1] : null);

    function decodeBase64UTF8(base64) {
      const binary = atob(base64.replace(/\s/g, ""));
      const bytes = new Uint8Array([...binary].map(c => c.charCodeAt(0)));
      return new TextDecoder("utf-8").decode(bytes);
    }

    if (postSlug) {
      // Find the actual filename by matching slug against _posts listing
      fetch(API_BASE)
        .then(r => r.json())
        .then(files => {
          const match = files.find(f => f.name.replace(/^\d{4}-\d{2}-\d{2}-/, "").replace(/\.md$/, "") === postSlug);
          if (!match) return;
          return fetch(match.url).then(r => r.json());
        })
        .then(data => {
          if (!data) return;
          const text = decodeBase64UTF8(data.content);
          const { meta, body } = parseFrontmatter(text);
          document.getElementById("post-title").textContent = meta.title || "Untitled";
          document.getElementById("post-date").textContent = meta.date ? formatDate(meta.date) : "";
          document.getElementById("post-body").innerHTML = marked.parse(body);
          document.getElementById("coming-soon").style.display = "none";
          document.getElementById("post-view").style.display = "flex";
          document.title = `${meta.title} – Purnima Rohilla`;
        })
        .catch(() => {
          document.getElementById("coming-soon").style.display = "flex";
        });

    } else {
      // Listing view
      fetch(API_BASE)
        .then(r => r.json())
        .then(files => {
         if (!Array.isArray(files) || files.length === 0) {
            document.getElementById("coming-soon").style.display = "flex";
            return;
          } // show Coming Soon

          const mdFiles = files.filter(f => f.name.endsWith(".md"));
          if (mdFiles.length === 0) {
            document.getElementById("coming-soon").style.display = "flex";
            return;
          }


          // Fetch all posts to get titles and dates
          return Promise.all(mdFiles.map(f =>
            fetch(f.url).then(r => r.json()).then(data => {
              const text = decodeBase64UTF8(data.content);
              const { meta } = parseFrontmatter(text);
              return { name: f.name, title: meta.title || f.name, date: meta.date || "" };
            })
          ));
        })
        .then(posts => {
          if (!posts || posts.length === 0) return;

          // Sort by date descending
          posts.sort((a, b) => new Date(b.date) - new Date(a.date));

          const list = document.getElementById("post-list");
          document.getElementById("post-list").innerHTML = "";
          posts.forEach(post => {
            // Strip date prefix (YYYY-MM-DD-) and .md extension for clean URL
            const slug = post.name.replace(/^\d{4}-\d{2}-\d{2}-/, "").replace(/\.md$/, "");
            const li = document.createElement("li");
            li.className = "post-item";
            li.innerHTML = `
              <a href="/blog/${encodeURIComponent(slug)}">${post.title}</a>
              <div class="post-date">${post.date ? formatDate(post.date) : ""}</div>
            `;
            list.appendChild(li);
          });

          document.getElementById("coming-soon").style.display = "none";
          document.getElementById("blog-listing").style.display = "block";
        })
        .catch(() => {
          document.getElementById("coming-soon").style.display = "flex";
        });
 // on any error, just show Coming Soon
    }
  </script>

</body>
</html>
