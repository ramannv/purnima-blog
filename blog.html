<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Blog – Purnima Rohilla" />
  <title>Blog – Purnima Rohilla</title>
  <link rel="icon" type="image/x-icon" href="photo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Lora&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #111111;
      --muted-light: #cdcdcd;
      --border-light: #dddddd;

      --bg-dark: #1a1a1a;
      --text-dark: #f5f5f5;
      --muted-dark: #dedada;
      --border-dark: #333333;
    }

    html[data-theme='light'] {
      --bg: var(--bg-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
    }

    html[data-theme='dark'] {
      --bg: var(--bg-dark);
      --text: var(--text-dark);
      --muted: var(--muted-dark);
      --border: var(--border-dark);
    }

    html {
      overflow-y: scroll;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Lora', serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.75;
      font-size: 18px;
      transition: background-color 0.3s, color 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .toggle-btn {
      position: fixed;
      top: 0.6rem;
      right: 1rem;
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      background-color: var(--bg);
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s, border 0.3s;
      z-index: 1001;
    }

    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem;
      font-family: 'Playfair Display', serif;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .topnav a {
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .topnav a:hover,
    .topnav a.active {
      color: var(--text);
      font-weight: bold;
    }

    .topnav .divider {
      color: var(--border);
      user-select: none;
    }

    .coming-soon-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
    }

    .coming-soon-wrapper h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin: 0 0 1rem 0;
      letter-spacing: 0.05em;
    }

    .coming-soon-wrapper p {
      color: var(--muted);
      font-size: 1.5rem;
      margin: 0;
    }

    .hr-divider {
      width: 60px;
      height: 1px;
      background-color: var(--border);
      margin: 1.5rem auto;
    }

    .office-quote {
      margin: 2.5rem auto 0;
      max-width: 480px;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.8;
      padding-left: 0;
      text-align: center;
    }

    .office-quote cite {
      display: block;
      margin-top: 0.75rem;
      font-style: normal;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    @media (max-width: 480px) {
      .topnav a {
        font-size: 0.75rem;
        padding: 0.4rem 0.5rem;
      }

      .coming-soon-wrapper h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <button class="toggle-btn" onclick="toggleTheme()" id="theme-toggle" title="Toggle light/dark mode">
    🌞 Dark
  </button>

  <nav class="topnav">
    <a href="index.html">About</a>
    <span class="divider">|</span>
    <a href="blog.html" class="active">Blog</a>
  </nav>

  <div class="coming-soon-wrapper">
    <h1>Blog</h1>
    <div class="hr-divider"></div>
    <p>Coming Soon</p>
    <blockquote class="office-quote">
      "Before I do anything I ask myself, 'Would an idiot do that?' And if the answer is yes, I do not do that thing."
      <cite>— Dwight Schrute</cite>
    </blockquote>
  </div>

  <footer>
    &copy; 2025 Purnima Rohilla — All rights reserved.
  </footer>

  <script>
    const toggleBtn = document.getElementById("theme-toggle");
    const saved = localStorage.getItem("theme");
    if (saved) {
      document.documentElement.setAttribute("data-theme", saved);
      updateToggleText(saved);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      updateToggleText(next);
    }

    function updateToggleText(theme) {
      toggleBtn.textContent = theme === "light" ? "🌞 Dark" : "🌙 Light";
    }
  </script>
</body>
</html>
