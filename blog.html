<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="serif">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Blog – Purnima Rohilla" />
  <title>Blog – Purnima Rohilla</title>
  <link rel="icon" type="image/x-icon" href="photo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Lora&family=Playfair+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #111111;
      --subheading-light: #555555;
      --muted-light: #999999;
      --border-light: #dddddd;

      --bg-sepia: #f4efe6;
      --text-sepia: #2c2416;
      --subheading-sepia: #5a4a30;
      --muted-sepia: #8a7560;
      --border-sepia: #d6c9b0;

      --bg-dark: #1a1a1a;
      --text-dark: #f5f5f5;
      --subheading-dark: #c0b8b0;
      --muted-dark: #888888;
      --border-dark: #333333;
    }
    html[data-theme='light'] { --bg: var(--bg-light); --text: var(--text-light); --subheading: var(--subheading-light); --muted: var(--muted-light); --border: var(--border-light); }
    html[data-theme='sepia']  { --bg: var(--bg-sepia);  --text: var(--text-sepia);  --subheading: var(--subheading-sepia);  --muted: var(--muted-sepia);  --border: var(--border-sepia); }
    html[data-theme='dark']   { --bg: var(--bg-dark);   --text: var(--text-dark);   --subheading: var(--subheading-dark);   --muted: var(--muted-dark);   --border: var(--border-dark); }

    html[data-font='serif']     { --body-font: 'Lora', Georgia, serif; }
    html[data-font='sans-serif'] { --body-font: 'Inter', system-ui, sans-serif; }

    html { overflow-y: scroll; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--body-font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.75;
      font-size: 18px;
      transition: background-color 0.3s, color 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Settings button */
    .settings-btn {
      position: fixed;
      top: 0.55rem;
      right: 1rem;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      z-index: 1002;
      line-height: 1;
    }

    /* Settings popup */
    .settings-popup {
      position: fixed;
      top: 2.6rem;
      right: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      z-index: 1003;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      min-width: 200px;
      transition: background-color 0.3s, border-color 0.3s;
    }
    .settings-popup.open { display: block; }
    .settings-group { margin-bottom: 0.75rem; }
    .settings-group:last-child { margin-bottom: 0; }
    .settings-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-family: 'Inter', sans-serif;
    }
    .settings-options {
      display: flex;
      gap: 0.4rem;
    }
    .settings-opt {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      font-family: inherit;
    }
    .settings-opt:hover { color: var(--text); border-color: var(--text); }
    .settings-opt.active { color: var(--text); border-color: var(--text); font-weight: 600; }
    .topnav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem;
      font-family: 'Playfair Display', serif;
      transition: background-color 0.3s, border-color 0.3s;
    }
    .topnav a {
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .topnav a:hover, .topnav a.active { color: var(--text); font-weight: bold; }
    .topnav .divider { color: var(--border); user-select: none; }

    /* Coming Soon (hidden by default) */
    .coming-soon-wrapper {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
    }
    .coming-soon-wrapper h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin: 0 0 1rem 0;
    }
    .coming-soon-wrapper p { color: var(--muted); font-size: 1.5rem; margin: 0; }
    .hr-divider { width: 60px; height: 1px; background-color: var(--border); margin: 1.5rem auto; }
    .office-quote {
      margin: 2.5rem auto 0;
      max-width: 480px;
      font-style: italic;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.8;
      text-align: center;
    }
    .office-quote cite { display: block; margin-top: 0.75rem; font-style: normal; font-size: 0.85rem; }

    /* Blog listing */
    .blog-wrapper {
      flex: 1;
      width: 100%;
      max-width: 720px;
      padding: 6rem 1.5rem 4rem;
      display: none;
    }
    .blog-wrapper h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin: 0 0 1rem 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    /* Tag filter */
    .tag-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .tag-btn {
      font-family: 'Lora', serif;
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tag-btn:hover, .tag-btn.active { color: var(--text); border-color: var(--text); }

    .post-list { list-style: none; padding: 0; margin: 0; }
    .post-item { padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
    .post-item.hidden { display: none; }

    /* Cover image thumbnail in listing */
    .post-cover-thumb {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      display: block;
    }

    .post-item-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      text-decoration: none;
      color: var(--text);
    }
    .post-item-title:hover { text-decoration: underline; }

    .post-item-desc {
      font-size: 0.95rem;
      color: var(--subheading);
      margin: 0.3rem 0 0.5rem;
      font-style: italic;
    }

    .post-item-excerpt {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0.4rem 0 0.5rem;
      line-height: 1.6;
    }

    .post-meta {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .post-tag {
      font-size: 0.78rem;
      padding: 0.15rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }
    .post-tag:hover { color: var(--text); border-color: var(--text); }

    /* Single post view */
    .post-wrapper {
      flex: 1;
      width: 100%;
      max-width: 720px;
      padding: 6rem 1.5rem 4rem;
      display: none;
      flex-direction: column;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--text); }

    .post-cover {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 1.5rem;
    }

    .post-wrapper h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin: 0 0 0.4rem 0;
    }
    .post-description {
      font-size: 1.1rem;
      color: var(--subheading);
      margin: 0 0 0.5rem 0;
      font-style: italic;
    }
    .post-date {
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
    }
    .post-reading-time {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .post-header-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .post-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .post-wrapper .post-body { line-height: 1.9; margin-top: 1.5rem; }
    .post-wrapper .post-body h1,
    .post-wrapper .post-body h2,
    .post-wrapper .post-body h3 { font-family: 'Playfair Display', serif; }

    /* Prev/Next nav */
    .post-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      gap: 1rem;
    }
    .post-nav a { color: var(--muted); text-decoration: none; max-width: 45%; }
    .post-nav a:hover { color: var(--text); }
    .post-nav .nav-label { font-size: 0.75rem; display: block; margin-bottom: 0.2rem; }
    .post-nav .nav-prev { text-align: left; }
    .post-nav .nav-next { text-align: right; margin-left: auto; }

    /* Share buttons */
    .share-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .share-btn {
      font-family: 'Lora', serif;
      font-size: 0.82rem;
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .share-btn:hover { color: var(--text); border-color: var(--text); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    @media (max-width: 480px) {
      .topnav a { font-size: 0.75rem; padding: 0.4rem 0.5rem; }
    }
  </style>
</head>
<body>

  <button class="settings-btn" onclick="toggleSettings(event)" id="settings-btn" title="Settings">⚙</button>

  <div class="settings-popup" id="settings-popup">
    <div class="settings-group">
      <div class="settings-label">Theme</div>
      <div class="settings-options">
        <button class="settings-opt" data-theme="light" onclick="setTheme('light')">Light</button>
        <button class="settings-opt" data-theme="sepia" onclick="setTheme('sepia')">Sepia</button>
        <button class="settings-opt" data-theme="dark" onclick="setTheme('dark')">Dark</button>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-label">Font</div>
      <div class="settings-options">
        <button class="settings-opt" data-font="serif" onclick="setFont('serif')" style="font-family:'Lora',serif">Serif</button>
        <button class="settings-opt" data-font="sans-serif" onclick="setFont('sans-serif')" style="font-family:'Inter',sans-serif">Sans</button>
      </div>
    </div>
  </div>

  <nav class="topnav">
    <a href="index.html">About</a>
    <span class="divider">|</span>
    <a href="/blog.html" class="active">Blog</a>
  </nav>

  <!-- Coming Soon -->
  <div class="coming-soon-wrapper" id="coming-soon">
    <h1>Blog</h1>
    <div class="hr-divider"></div>
    <p>Coming Soon</p>
    <blockquote class="office-quote">
      "Before I do anything I ask myself, 'Would an idiot do that?' And if the answer is yes, I do not do that thing."
      <cite>— Dwight Schrute</cite>
    </blockquote>
  </div>

  <!-- Blog listing -->
  <div class="blog-wrapper" id="blog-listing">
    <h1>Blog</h1>
    <div class="tag-filter" id="tag-filter"></div>
    <ul class="post-list" id="post-list"></ul>
  </div>

  <!-- Single post view -->
  <div class="post-wrapper" id="post-view">
    <a class="back-link" href="/blog.html">← Back to Blog</a>
    <img class="post-cover" id="post-cover" src="" alt="" style="display:none" />
    <h1 id="post-title"></h1>
    <p class="post-description" id="post-description"></p>
    <div class="post-header-meta">
      <span class="post-date" id="post-date"></span>
      <span class="post-reading-time" id="post-reading-time"></span>
    </div>
    <div class="post-tags-row" id="post-tags-row"></div>
    <div class="post-body" id="post-body"></div>
    <div class="share-row">
      Share:
      <a class="share-btn" id="share-twitter" href="#" target="_blank">𝕏 Twitter</a>
      <button class="share-btn" onclick="copyLink()">Copy Link</button>
    </div>
    <div class="post-nav" id="post-nav"></div>
  </div>

  <footer>&copy; 2025 Purnima Rohilla — All rights reserved.</footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({ breaks: true });

    // Settings popup
    const popup = document.getElementById("settings-popup");

    function toggleSettings(e) {
      e.stopPropagation();
      popup.classList.toggle("open");
    }
    document.addEventListener("click", function(e) {
      if (!popup.contains(e.target) && e.target.id !== "settings-btn") {
        popup.classList.remove("open");
      }
    });

    function setTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      localStorage.setItem("theme", t);
      updateActiveOpts();
    }
    function setFont(f) {
      document.documentElement.setAttribute("data-font", f);
      localStorage.setItem("font", f);
      updateActiveOpts();
    }
    function updateActiveOpts() {
      const curTheme = document.documentElement.getAttribute("data-theme");
      const curFont = document.documentElement.getAttribute("data-font");
      document.querySelectorAll(".settings-opt[data-theme]").forEach(b => b.classList.toggle("active", b.dataset.theme === curTheme));
      document.querySelectorAll(".settings-opt[data-font]").forEach(b => b.classList.toggle("active", b.dataset.font === curFont));
    }

    // Restore saved prefs
    const savedTheme = localStorage.getItem("theme");
    const savedFont  = localStorage.getItem("font");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
    if (savedFont)  document.documentElement.setAttribute("data-font", savedFont);
    updateActiveOpts();

    // GitHub config
    const GITHUB_USER = "ramannv";
    const GITHUB_REPO = "purnima-blog";
    const POSTS_PATH = "_posts";
    const BRANCH = "main";
    const API_BASE = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_PATH}?ref=${BRANCH}`;

    function decodeBase64UTF8(b64) {
      const bin = atob(b64.replace(/\s/g, ""));
      return new TextDecoder("utf-8").decode(new Uint8Array([...bin].map(c => c.charCodeAt(0))));
    }

    function parseFrontmatter(text) {
      const m = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      if (!m) return { meta: {}, body: text };
      const meta = {};
      m[1].split("\n").forEach(line => {
        const idx = line.indexOf(":");
        if (idx < 0) return;
        const key = line.slice(0, idx).trim();
        const val = line.slice(idx + 1).trim().replace(/^["']|["']$/g, "");
        // Handle YAML lists (- item)
        if (!meta[key]) meta[key] = val;
      });
      // Parse tags as array if present
      const tagsMatch = m[1].match(/tags:\n((?:\s+-\s+.+\n?)+)/);
      if (tagsMatch) {
        meta.tags = tagsMatch[1].match(/- (.+)/g).map(t => t.replace("- ", "").trim());
      } else if (meta.tags) {
        meta.tags = meta.tags.split(",").map(t => t.trim()).filter(Boolean);
      }
      return { meta, body: m[2] };
    }

    function formatDate(d) {
      return new Date(d).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    function readingTime(text) {
      const words = text.trim().split(/\s+/).length;
      const mins = Math.max(1, Math.round(words / 200));
      return `${mins} min read`;
    }

    function getSlug(filename) {
      return filename.replace(/^\d{4}-\d{2}-\d{2}-/, "").replace(/\.md$/, "");
    }

    function excerpt(body, len = 160) {
      const plain = body.replace(/[#*`_\[\]]/g, "").replace(/\n+/g, " ").trim();
      return plain.length > len ? plain.slice(0, len).trimEnd() + "…" : plain;
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => alert("Link copied!"));
    }

    // Routing
    const params = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const postSlug = params.get("post") || (pathParts[0] === "blog" && pathParts[1] ? pathParts[1] : null);

    if (postSlug) {
      // Single post view
      fetch(API_BASE)
        .then(r => r.json())
        .then(files => {
          const allMd = files.filter(f => f.name.endsWith(".md"));
          const idx = allMd.findIndex(f => getSlug(f.name) === postSlug);
          if (idx < 0) return;

          // Prev / Next
          const prevFile = allMd[idx + 1] || null;
          const nextFile = allMd[idx - 1] || null;

          return fetch(allMd[idx].url).then(r => r.json()).then(data => {
            const text = decodeBase64UTF8(data.content);
            const { meta, body } = parseFrontmatter(text);

            document.getElementById("post-title").textContent = meta.title || "Untitled";
            document.title = `${meta.title || "Post"} – Purnima Rohilla`;

            const descEl = document.getElementById("post-description");
            if (meta.description) descEl.textContent = meta.description; else descEl.style.display = "none";

            document.getElementById("post-date").textContent = meta.date ? formatDate(meta.date) : "";
            document.getElementById("post-reading-time").textContent = "· " + readingTime(body);

            // Cover image
            if (meta.cover) {
              const img = document.getElementById("post-cover");
              img.src = meta.cover;
              img.alt = meta.title || "";
              img.style.display = "block";
            }

            // Tags
            const tagsRow = document.getElementById("post-tags-row");
            if (meta.tags && meta.tags.length) {
              meta.tags.forEach(tag => {
                const a = document.createElement("a");
                a.className = "post-tag";
                a.textContent = tag;
                a.href = `/blog.html?tag=${encodeURIComponent(tag)}`;
                tagsRow.appendChild(a);
              });
            }

            document.getElementById("post-body").innerHTML = marked.parse(body);

            // Share
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(meta.title)}&url=${encodeURIComponent(window.location.href)}`;
            document.getElementById("share-twitter").href = twitterUrl;

            // Prev / Next nav
            const navEl = document.getElementById("post-nav");
            if (prevFile || nextFile) {
              if (prevFile) {
                const a = document.createElement("a");
                a.className = "nav-prev";
                a.href = `/blog/${getSlug(prevFile.name)}`;
                a.innerHTML = `<span class="nav-label">← Older</span>${getSlug(prevFile.name).replace(/-/g, " ")}`;
                navEl.appendChild(a);
              }
              if (nextFile) {
                const a = document.createElement("a");
                a.className = "nav-next";
                a.href = `/blog/${getSlug(nextFile.name)}`;
                a.innerHTML = `<span class="nav-label">Newer →</span>${getSlug(nextFile.name).replace(/-/g, " ")}`;
                navEl.appendChild(a);
              }
            }

            document.getElementById("coming-soon").style.display = "none";
            document.getElementById("post-view").style.display = "flex";
          });
        })
        .catch(() => { document.getElementById("coming-soon").style.display = "flex"; });

    } else {
      // Listing view — also support ?tag= filtering
      const activeTag = params.get("tag") || null;

      fetch(API_BASE)
        .then(r => r.json())
        .then(files => {
          if (!Array.isArray(files) || !files.length) { document.getElementById("coming-soon").style.display = "flex"; return; }
          const mdFiles = files.filter(f => f.name.endsWith(".md"));
          if (!mdFiles.length) { document.getElementById("coming-soon").style.display = "flex"; return; }
          return Promise.all(mdFiles.map(f =>
            fetch(f.url).then(r => r.json()).then(data => {
              const text = decodeBase64UTF8(data.content);
              const { meta, body } = parseFrontmatter(text);
              return { name: f.name, title: meta.title || f.name, date: meta.date || "", description: meta.description || "", cover: meta.cover || "", tags: meta.tags || [], body };
            })
          ));
        })
        .then(posts => {
          if (!posts || !posts.length) return;
          posts.sort((a, b) => new Date(b.date) - new Date(a.date));

          // Build tag filter
          const allTags = [...new Set(posts.flatMap(p => p.tags))].filter(Boolean);
          const tagFilter = document.getElementById("tag-filter");
          if (allTags.length) {
            const all = document.createElement("button");
            all.className = "tag-btn" + (!activeTag ? " active" : "");
            all.textContent = "All";
            all.onclick = () => window.location = "/blog.html";
            tagFilter.appendChild(all);
            allTags.forEach(tag => {
              const btn = document.createElement("button");
              btn.className = "tag-btn" + (activeTag === tag ? " active" : "");
              btn.textContent = tag;
              btn.onclick = () => window.location = `/blog.html?tag=${encodeURIComponent(tag)}`;
              tagFilter.appendChild(btn);
            });
          }

          // Render posts
          const list = document.getElementById("post-list");
          list.innerHTML = "";
          posts.forEach(post => {
            const slug = getSlug(post.name);
            const matchesTag = !activeTag || post.tags.includes(activeTag);
            const li = document.createElement("li");
            li.className = "post-item" + (matchesTag ? "" : " hidden");

            let html = "";
            if (post.cover) html += `<img class="post-cover-thumb" src="${post.cover}" alt="${post.title}" />`;
            html += `<a class="post-item-title" href="/blog/${encodeURIComponent(slug)}">${post.title}</a>`;
            if (post.description) html += `<div class="post-item-desc">${post.description}</div>`;
            html += `<div class="post-item-excerpt">${excerpt(post.body)}</div>`;
            html += `<div class="post-meta"><span>${post.date ? formatDate(post.date) : ""}</span><span>${readingTime(post.body)}</span>`;
            if (post.tags.length) {
              post.tags.forEach(tag => {
                html += `<span class="post-tag" onclick="window.location='/blog.html?tag=${encodeURIComponent(tag)}'">${tag}</span>`;
              });
            }
            html += `</div>`;
            li.innerHTML = html;
            list.appendChild(li);
          });

          document.getElementById("coming-soon").style.display = "none";
          document.getElementById("blog-listing").style.display = "block";
        })
        .catch(() => { document.getElementById("coming-soon").style.display = "flex"; });
    }
  </script>
</body>
</html>
