backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subheading", name: "description", widget: "string", required: false, hint: "Optional subtitle shown below the title" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false, hint: "Optional header image for the post" }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Comma-separated tags e.g. AI Policy, Research" }
      - { label: "Body", name: "body", widget: "markdown" }
